<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhatIfOrbit</title>
    <link data-trunk rel="rust" data-bin="whatiforbit" data-wasm-opt="s" />
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020308;
      }
      #whatiforbit-canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8899bb;
        font-family: system-ui, sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading WhatIfOrbit… (first load downloads the simulation, hang tight)</div>
    <canvas id="whatiforbit-canvas" tabindex="0"></canvas>
    <script>
      addEventListener("TrunkApplicationStarted", () => {
        document.getElementById("loading").remove();
      });
      // Keyboard events only reach the app if the canvas has DOM focus.
      // winit is supposed to focus it on click, but that path is unreliable
      // across browsers/embeddings — egui then shows a text caret while
      // keystrokes silently go to <body>. Force focus on any interaction.
      const canvas = document.getElementById("whatiforbit-canvas");
      canvas.addEventListener("pointerdown", () => {
        if (document.activeElement !== canvas) {
          canvas.focus({ preventScroll: true });
        }
      });
      // winit preventDefault()s every keydown, which suppresses the browser's
      // native copy/cut/paste events — the only channel bevy_egui's web
      // clipboard has. Hide those key combos from winit (this capture-phase
      // listener registers before the wasm boots, so it runs first) and let
      // the browser fire the clipboard event instead.
      canvas.addEventListener(
        "keydown",
        (e) => {
          const k = e.key.toLowerCase();
          if ((e.metaKey || e.ctrlKey) && (k === "v" || k === "c" || k === "x")) {
            e.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
  </body>
</html>
